<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>我的 AI 助手</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 16px;
    }
    #log {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      min-height: 300px;
      max-height: 60vh;
      overflow-y: auto;
    }
    .user { color: #0b5; margin: 8px 0; }
    .ai { color: #333; margin: 8px 0; }

    /* Markdown 渲染后的样式 */
    .ai p { margin: 6px 0; line-height: 1.7; }
    .ai h1, .ai h2, .ai h3 { margin: 12px 0 6px; }
    .ai ul, .ai ol { padding-left: 22px; margin: 6px 0; }
    .ai li { margin: 3px 0; }
    .ai pre {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
    }
    .ai code {
      background: #f0f0f0;
      padding: 2px 5px;
      border-radius: 3px;
      font-size: 13px;
    }
    .ai pre code { background: none; padding: 0; }
    .ai > :first-child { margin-top: 0; }

    #bar { display: flex; gap: 8px; margin-top: 12px; }
    input { flex: 1; padding: 10px; font-size: 15px; }
    button { padding: 10px 20px; font-size: 15px; }
  </style>
</head>
<body>
  <h2>我的 AI 助手</h2>

  <div id="log"></div>

  <div id="bar">
    <input id="q" placeholder="输入问题，回车发送" />
    <button onclick="send()">发送</button>
  </div>

  <script>
    const log = document.getElementById("log");
    const q = document.getElementById("q");

    q.addEventListener("keydown", e => {
      if (e.key === "Enter") send();
    });

    // 发送消息
    async function send() {
      const text = q.value.trim();
      if (!text) return;
      q.value = "";

      // 用户输入原样显示（不渲染 Markdown）
      log.innerHTML += `<div class="user">你：${text}</div>`;

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();

        const html = marked.parse(data.answer || data.error || "");
        log.innerHTML += `<div class="ai">AI：${html}</div>`;
      } catch (err) {
        log.innerHTML += `<div class="ai">请求失败：${err.message}</div>`;
      }

      log.scrollTop = log.scrollHeight;
    }

    // 页面加载时拉历史
    async function loadHistory() {
      try {
        const res = await fetch("/history");
        const data = await res.json();

        for (const m of data.messages) {
          const who = m.role === "user" ? "你" : "AI";
          const cls = m.role === "user" ? "user" : "ai";
          // 用户内容不渲染，AI 内容渲染
          const html = m.role === "user" ? m.content : marked.parse(m.content);
          log.innerHTML += `<div class="${cls}">${who}：${html}</div>`;
        }

        log.scrollTop = log.scrollHeight;
      } catch (err) {
        console.error("加载历史失败", err);
      }
    }

    loadHistory();
  </script>
</body>
</html>
